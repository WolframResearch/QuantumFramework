<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="720" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Dependency graph · Backbone: Rapid Purification by Choosing What to Measure</text>
  <text x="490" y="48" text-anchor="middle" font-size="10.5" fill="#777">nodes and edges are exactly the page's from-lists · source: backbone-rapid-purification.md</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A6699C"/>
    </marker>
  </defs>

  <!-- solid derivation edges -->
  <line x1="340" y1="118" x2="370" y2="175" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="565" y1="118" x2="450" y2="175" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="790" y1="118" x2="520" y2="175" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="400" y1="235" x2="400" y2="285" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="400" y1="343" x2="400" y2="395" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="400" y1="455" x2="400" y2="515" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="120" y1="118" x2="290" y2="515" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="550" y1="210" x2="658" y2="295" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="550" y1="225" x2="658" y2="410" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="530" y1="440" x2="658" y2="527" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- dashed weakening edges -->
  <line x1="610" y1="118" x2="740" y2="285" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <path d="M 830 118 C 930 220, 930 330, 800 395" fill="none" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>

  <!-- roots and choice -->
  <rect x="35" y="60" width="170" height="58" rx="8" fill="#FDF2DA" stroke="#C09A4A" stroke-width="1.5"/>
  <text x="120" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">C1 · choice</text>
  <text x="120" y="92" text-anchor="middle" font-size="10.5" fill="#333">score = impurity ℓ</text>
  <text x="120" y="105" text-anchor="middle" font-size="10.5" fill="#333">(entropy equivalent)</text>

  <rect x="255" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="340" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R1 · assumption</text>
  <text x="340" y="92" text-anchor="middle" font-size="10.5" fill="#333">one axis watched,</text>
  <text x="340" y="105" text-anchor="middle" font-size="10.5" fill="#333">diffusive, strength k</text>

  <rect x="480" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="565" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R2 · assumption</text>
  <text x="565" y="92" text-anchor="middle" font-size="10.5" fill="#333">complete record,</text>
  <text x="565" y="105" text-anchor="middle" font-size="10.5" fill="#333">η = 1</text>

  <rect x="705" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="790" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R3 · assumption</text>
  <text x="790" y="92" text-anchor="middle" font-size="10.5" fill="#333">no other coupling</text>

  <!-- equation node, double border = cited -->
  <rect x="250" y="177" width="300" height="58" rx="8" fill="#E9F4EA" stroke="#5E9C6B" stroke-width="1.5"/>
  <rect x="254" y="181" width="292" height="50" rx="6" fill="none" stroke="#5E9C6B" stroke-width="0.8"/>
  <text x="400" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S0 · equation (cited)</text>
  <text x="400" y="211" text-anchor="middle" font-size="10.5" fill="#333">dρ = kD[M]dt + √k H[M]dW</text>
  <text x="400" y="225" text-anchor="middle" font-size="10.5" fill="#333">dy = ⟨M⟩dt + dW/(2√k)</text>

  <!-- statements -->
  <rect x="270" y="287" width="260" height="56" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="400" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S1 · impurity increment</text>
  <text x="400" y="323" text-anchor="middle" font-size="10.5" fill="#333">drift ≤ 0; noise ∝ cos θ</text>

  <rect x="270" y="397" width="260" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="400" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2 · two protocols</text>
  <text x="400" y="429" text-anchor="middle" font-size="10.5" fill="#333">steer ⊥: ℓ = ℓ₀e^(-4kt)</text>
  <text x="400" y="442" text-anchor="middle" font-size="10.5" fill="#333">on every record</text>

  <!-- headline -->
  <rect x="250" y="517" width="300" height="58" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <text x="400" y="535" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">H · headline</text>
  <text x="400" y="550" text-anchor="middle" font-size="10.5" fill="#333">deadline and race rank</text>
  <text x="400" y="563" text-anchor="middle" font-size="10.5" fill="#333">the protocols oppositely</text>
  <text x="400" y="591" text-anchor="middle" font-size="9.5" font-style="italic" fill="#888">audit: rests on S0 + C1 · S0 from R1 R2 R3 · no conjectures</text>

  <!-- weakened statements and non-assumption -->
  <rect x="660" y="287" width="200" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="760" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S3 · R2 weakened</text>
  <text x="760" y="319" text-anchor="middle" font-size="10.5" fill="#333">floor (1-η)/2;</text>
  <text x="760" y="332" text-anchor="middle" font-size="10.5" fill="#333">verdict reverses</text>

  <rect x="660" y="397" width="200" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="760" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S4 · R3 weakened</text>
  <text x="760" y="429" text-anchor="middle" font-size="10.5" fill="#333">cap exactly when unwatched</text>
  <text x="760" y="442" text-anchor="middle" font-size="10.5" fill="#333">attractor is mixed</text>

  <rect x="660" y="517" width="200" height="58" rx="8" fill="#FAFAFA" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="760" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">N · non-assumption</text>
  <text x="760" y="549" text-anchor="middle" font-size="10.5" fill="#333">a drive is absorbed</text>
  <text x="760" y="562" text-anchor="middle" font-size="10.5" fill="#333">by the re-aiming</text>

  <!-- legend -->
  <rect x="30" y="656" width="14" height="14" rx="3" fill="#E7EEF9" stroke="#5B7DB1"/>
  <text x="50" y="667" font-size="10.5" fill="#333">assumption</text>
  <rect x="130" y="656" width="14" height="14" rx="3" fill="#FDF2DA" stroke="#C09A4A"/>
  <text x="150" y="667" font-size="10.5" fill="#333">choice</text>
  <rect x="205" y="656" width="14" height="14" rx="3" fill="#E9F4EA" stroke="#5E9C6B"/>
  <text x="225" y="667" font-size="10.5" fill="#333">equation, cited</text>
  <rect x="315" y="656" width="14" height="14" rx="3" fill="#F4F4F4" stroke="#909090"/>
  <text x="335" y="667" font-size="10.5" fill="#333">statement</text>
  <rect x="405" y="656" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="425" y="667" font-size="10.5" fill="#333">headline</text>
  <rect x="485" y="656" width="14" height="14" rx="3" fill="#FAFAFA" stroke="#999" stroke-dasharray="3 2"/>
  <text x="505" y="667" font-size="10.5" fill="#333">recorded non-assumption</text>
  <line x1="660" y1="663" x2="700" y2="663" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="708" y="667" font-size="10.5" fill="#333">derives from</text>
  <line x1="790" y1="663" x2="830" y2="663" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <text x="838" y="667" font-size="10.5" fill="#333">weakens</text>
</svg>
