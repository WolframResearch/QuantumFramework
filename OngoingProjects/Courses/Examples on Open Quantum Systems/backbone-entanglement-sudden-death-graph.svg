<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="800" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Dependency graph · Backbone: Entanglement Sudden Death Under Independent Local Noise</text>
  <text x="490" y="48" text-anchor="middle" font-size="10.5" fill="#777">nodes and edges are exactly the page's from-lists · source: backbone-entanglement-sudden-death.md</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A6699C"/>
    </marker>
  </defs>

  <!-- solid derivation edges -->
  <line x1="115" y1="118" x2="265" y2="188" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="305" y1="118" x2="305" y2="188" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="495" y1="118" x2="345" y2="188" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="305" y1="246" x2="305" y2="294" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="665" y1="118" x2="420" y2="294" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 860 118 C 780 240, 620 300, 448 322" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="305" y1="364" x2="305" y2="412" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="705" y1="118" x2="448" y2="430" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="305" y1="482" x2="305" y2="530" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 890 118 C 950 350, 720 520, 453 566" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 445 340 C 620 400, 680 520, 615 648" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- dashed weakening edges -->
  <path d="M 388 108 C 560 220, 700 420, 598 648" fill="none" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <path d="M 60 118 C 15 300, 15 500, 130 648" fill="none" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>

  <!-- roots -->
  <rect x="30" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="115" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R1 · assumption</text>
  <text x="115" y="92" text-anchor="middle" font-size="10.5" fill="#333">independent baths: each</text>
  <text x="115" y="105" text-anchor="middle" font-size="10.5" fill="#333">qubit its own, nothing shared</text>

  <rect x="220" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="305" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R2 · assumption</text>
  <text x="305" y="92" text-anchor="middle" font-size="10.5" fill="#333">zero temperature: absorbs,</text>
  <text x="305" y="105" text-anchor="middle" font-size="10.5" fill="#333">never re-excites; rate γ</text>

  <rect x="410" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="495" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R3 · assumption</text>
  <text x="495" y="92" text-anchor="middle" font-size="10.5" fill="#333">memoryless:</text>
  <text x="495" y="105" text-anchor="middle" font-size="10.5" fill="#333">one constant rate</text>

  <rect x="600" y="60" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="685" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R4 · assumption</text>
  <text x="685" y="92" text-anchor="middle" font-size="10.5" fill="#333">X-class initial states;</text>
  <text x="685" y="105" text-anchor="middle" font-size="10.5" fill="#333">probes Φ = α|00⟩+β|11⟩, Ψ</text>

  <rect x="790" y="60" width="170" height="58" rx="8" fill="#FDF2DA" stroke="#C09A4A" stroke-width="1.5"/>
  <text x="875" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">C1 · choice</text>
  <text x="875" y="92" text-anchor="middle" font-size="10.5" fill="#333">score = concurrence;</text>
  <text x="875" y="105" text-anchor="middle" font-size="10.5" fill="#333">death time score-independent</text>

  <!-- equation node, double border = cited -->
  <rect x="190" y="190" width="230" height="56" rx="8" fill="#E9F4EA" stroke="#5E9C6B" stroke-width="1.5"/>
  <rect x="194" y="194" width="222" height="48" rx="6" fill="none" stroke="#5E9C6B" stroke-width="0.8"/>
  <text x="305" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S0 · equation (cited)</text>
  <text x="305" y="230" text-anchor="middle" font-size="10.5" fill="#333">dρ/dt = γ(D[σ₋⊗1] + D[1⊗σ₋])ρ</text>

  <!-- statements -->
  <rect x="165" y="296" width="280" height="68" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="305" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S1 · solved channel</text>
  <text x="305" y="331" text-anchor="middle" font-size="10.5" fill="#333">six flows, analytic in e<tspan font-size="7.5" dy="-3.5">−γt</tspan><tspan dy="3.5">;</tspan></text>
  <text x="305" y="345" text-anchor="middle" font-size="10.5" fill="#333">C = 2max(0, w-√(bc), z-√(ad))</text>

  <rect x="165" y="414" width="280" height="68" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="305" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2 · the death criterion</text>
  <text x="305" y="449" text-anchor="middle" font-size="10.5" fill="#333">outer: w² &lt; (b+d)(c+d); inner: z² &lt; d;</text>
  <text x="305" y="463" text-anchor="middle" font-size="10.5" fill="#333">Φ: p<tspan font-size="7.5" dy="2.5">d</tspan><tspan dy="-2.5"> = α/β iff β&gt;α; Ψ: never</tspan></text>

  <!-- headline -->
  <rect x="160" y="532" width="290" height="68" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <text x="305" y="551" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">H · headline</text>
  <text x="305" y="567" text-anchor="middle" font-size="10.5" fill="#333">smooth motion, sudden death:</text>
  <text x="305" y="581" text-anchor="middle" font-size="10.5" fill="#333">the kink at the separable boundary</text>
  <text x="305" y="622" text-anchor="middle" font-size="9.5" font-style="italic" fill="#888">audit: rests on S0 + R4, C1 via S1, S2 · S0 from R1 R2 R3 · no conjectures</text>

  <!-- weakened statements -->
  <rect x="30" y="650" width="210" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="135" y="667" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S0′ · R1 weakened</text>
  <text x="135" y="682" text-anchor="middle" font-size="10.5" fill="#333">shared bath: singlet dark (ω<tspan font-size="7.5" dy="2.5">1</tspan><tspan dy="-2.5"> = ω</tspan><tspan font-size="7.5" dy="2.5">2</tspan><tspan dy="-2.5">);</tspan></text>
  <text x="135" y="695" text-anchor="middle" font-size="10.5" fill="#333">dark periods, revivals, creation</text>

  <rect x="500" y="650" width="220" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="610" y="667" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2′ · R2 weakened</text>
  <text x="610" y="682" text-anchor="middle" font-size="10.5" fill="#333">dephasing: populations freeze;</text>
  <text x="610" y="695" text-anchor="middle" font-size="10.5" fill="#333">no pure state dies, bc&gt;0 does</text>

  <!-- recorded non-assumption, detached -->
  <rect x="740" y="650" width="220" height="58" rx="8" fill="#FAFAFA" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="850" y="667" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">N · non-assumption</text>
  <text x="850" y="682" text-anchor="middle" font-size="10.5" fill="#333">local splittings commute;</text>
  <text x="850" y="695" text-anchor="middle" font-size="10.5" fill="#333">never needed</text>
  <text x="850" y="724" text-anchor="middle" font-size="9.5" font-style="italic" fill="#888">no incoming edges: local splittings change nothing under R1</text>

  <!-- legend -->
  <rect x="30" y="756" width="14" height="14" rx="3" fill="#E7EEF9" stroke="#5B7DB1"/>
  <text x="50" y="767" font-size="10.5" fill="#333">assumption</text>
  <rect x="130" y="756" width="14" height="14" rx="3" fill="#FDF2DA" stroke="#C09A4A"/>
  <text x="150" y="767" font-size="10.5" fill="#333">choice</text>
  <rect x="205" y="756" width="14" height="14" rx="3" fill="#E9F4EA" stroke="#5E9C6B"/>
  <text x="225" y="767" font-size="10.5" fill="#333">equation, cited</text>
  <rect x="315" y="756" width="14" height="14" rx="3" fill="#F4F4F4" stroke="#909090"/>
  <text x="335" y="767" font-size="10.5" fill="#333">statement</text>
  <rect x="405" y="756" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="425" y="767" font-size="10.5" fill="#333">headline</text>
  <rect x="485" y="756" width="14" height="14" rx="3" fill="#FAFAFA" stroke="#999" stroke-dasharray="3 2"/>
  <text x="505" y="767" font-size="10.5" fill="#333">recorded non-assumption</text>
  <line x1="660" y1="763" x2="700" y2="763" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="708" y="767" font-size="10.5" fill="#333">derives from</text>
  <line x1="790" y1="763" x2="830" y2="763" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <text x="838" y="767" font-size="10.5" fill="#333">weakens</text>
</svg>
