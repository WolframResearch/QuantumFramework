<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="740" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Dependency graph · Backbone: What the Twenty Examples Share, and the Cost of Discarding the Record</text>
  <text x="500" y="48" text-anchor="middle" font-size="10.5" fill="#777">nodes and edges are exactly the page's from-lists · source: backbone-catalog-spine.md</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A6699C"/>
    </marker>
  </defs>

  <!-- solid derivation edges -->
  <line x1="125" y1="120" x2="255" y2="185" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="310" y1="120" x2="308" y2="185" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="288" y1="241" x2="216" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="348" y1="241" x2="505" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="495" y1="120" x2="540" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="685" y1="120" x2="600" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="242" y1="356" x2="440" y2="414" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="552" y1="356" x2="558" y2="412" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 872 122 C 780 250, 705 360, 610 414" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="283" y1="243" x2="168" y2="570" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 336 243 C 312 390, 320 500, 366 570" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- dashed weakening edges -->
  <path d="M 620 122 C 120 210, 60 445, 128 566" fill="none" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <path d="M 478 122 C 402 280, 374 452, 373 566" fill="none" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>

  <!-- roots -->
  <rect x="40" y="62" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="125" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R1 · assumption</text>
  <text x="125" y="94" text-anchor="middle" font-size="10.5" fill="#333">Markovian; channels {c_k}</text>
  <text x="125" y="107" text-anchor="middle" font-size="10.5" fill="#333">on any Hilbert space</text>

  <rect x="225" y="62" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="310" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R2 · assumption</text>
  <text x="310" y="94" text-anchor="middle" font-size="10.5" fill="#333">keep the record: diffusive</text>
  <text x="310" y="107" text-anchor="middle" font-size="10.5" fill="#333">or jump, efficiency η_k</text>

  <rect x="410" y="62" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="495" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R3 · assumption</text>
  <text x="495" y="94" text-anchor="middle" font-size="10.5" fill="#333">the state starts</text>
  <text x="495" y="107" text-anchor="middle" font-size="10.5" fill="#333">in a pure state</text>

  <rect x="600" y="62" width="170" height="58" rx="8" fill="#E7EEF9" stroke="#5B7DB1" stroke-width="1.5"/>
  <text x="685" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">R4 · assumption</text>
  <text x="685" y="94" text-anchor="middle" font-size="10.5" fill="#333">complete ideal record:</text>
  <text x="685" y="107" text-anchor="middle" font-size="10.5" fill="#333">every channel, η = 1</text>

  <rect x="790" y="62" width="170" height="58" rx="8" fill="#FDF2DA" stroke="#C09A4A" stroke-width="1.5"/>
  <text x="875" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">C1 · choice</text>
  <text x="875" y="94" text-anchor="middle" font-size="10.5" fill="#333">score = record-averaged</text>
  <text x="875" y="107" text-anchor="middle" font-size="10.5" fill="#333">state = trace out detector</text>

  <!-- equation node, double border = cited -->
  <rect x="195" y="185" width="230" height="56" rx="8" fill="#E9F4EA" stroke="#5E9C6B" stroke-width="1.5"/>
  <rect x="199" y="189" width="222" height="48" rx="6" fill="none" stroke="#5E9C6B" stroke-width="0.8"/>
  <text x="310" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S0 · equation (cited)</text>
  <text x="310" y="221" text-anchor="middle" font-size="10.5" fill="#333">Lindblad master equation</text>
  <text x="310" y="234" text-anchor="middle" font-size="10.5" fill="#333">+ its unravelling (SME)</text>

  <!-- statements -->
  <rect x="95" y="300" width="210" height="56" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="200" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S1 · one average</text>
  <text x="200" y="335" text-anchor="middle" font-size="10.5" fill="#333">every unravelling → E[ρc]=ρ</text>
  <text x="200" y="348" text-anchor="middle" font-size="10.5" fill="#333">(joint N, small-dt limit)</text>

  <rect x="435" y="300" width="235" height="56" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="552" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2 · the purity split</text>
  <text x="552" y="335" text-anchor="middle" font-size="10.5" fill="#333">complete record + pure start:</text>
  <text x="552" y="348" text-anchor="middle" font-size="10.5" fill="#333">each run stays pure</text>

  <!-- headline -->
  <rect x="380" y="412" width="250" height="62" rx="8" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <text x="505" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">H · headline</text>
  <text x="505" y="447" text-anchor="middle" font-size="10.5" fill="#333">decoherence = the cost of</text>
  <text x="505" y="460" text-anchor="middle" font-size="10.5" fill="#333">discarding the record</text>
  <text x="505" y="490" text-anchor="middle" font-size="9.5" font-style="italic" fill="#888">audit: rests on S0 + R3, R4, C1 · S0 from R1 R2 · no conjectures</text>

  <!-- weakened statements -->
  <rect x="50" y="572" width="190" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="145" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2′ · R4 weakened</text>
  <text x="145" y="605" text-anchor="middle" font-size="10.5" fill="#333">incomplete record:</text>
  <text x="145" y="618" text-anchor="middle" font-size="10.5" fill="#333">conditioned state mixes</text>

  <rect x="280" y="572" width="190" height="58" rx="8" fill="#F4F4F4" stroke="#909090" stroke-width="1.5"/>
  <text x="375" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">S2″ · R3 weakened</text>
  <text x="375" y="605" text-anchor="middle" font-size="10.5" fill="#333">mixed start purifies</text>
  <text x="375" y="618" text-anchor="middle" font-size="10.5" fill="#333">to the pure trajectory</text>

  <!-- recorded non-assumption, detached -->
  <rect x="740" y="572" width="215" height="58" rx="8" fill="#FAFAFA" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="847" y="590" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">N · non-assumption</text>
  <text x="847" y="605" text-anchor="middle" font-size="10.5" fill="#333">no fixed dimension,</text>
  <text x="847" y="618" text-anchor="middle" font-size="10.5" fill="#333">no unique steady state</text>
  <text x="847" y="648" text-anchor="middle" font-size="9.5" font-style="italic" fill="#888">no incoming edges: one toolkit, all twenty examples</text>

  <!-- legend -->
  <rect x="40" y="696" width="14" height="14" rx="3" fill="#E7EEF9" stroke="#5B7DB1"/>
  <text x="60" y="707" font-size="10.5" fill="#333">assumption</text>
  <rect x="140" y="696" width="14" height="14" rx="3" fill="#FDF2DA" stroke="#C09A4A"/>
  <text x="160" y="707" font-size="10.5" fill="#333">choice</text>
  <rect x="215" y="696" width="14" height="14" rx="3" fill="#E9F4EA" stroke="#5E9C6B"/>
  <text x="235" y="707" font-size="10.5" fill="#333">equation, cited</text>
  <rect x="325" y="696" width="14" height="14" rx="3" fill="#F4F4F4" stroke="#909090"/>
  <text x="345" y="707" font-size="10.5" fill="#333">statement</text>
  <rect x="415" y="696" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="435" y="707" font-size="10.5" fill="#333">headline</text>
  <rect x="495" y="696" width="14" height="14" rx="3" fill="#FAFAFA" stroke="#999" stroke-dasharray="3 2"/>
  <text x="515" y="707" font-size="10.5" fill="#333">recorded non-assumption</text>
  <line x1="670" y1="703" x2="710" y2="703" stroke="#666" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="718" y="707" font-size="10.5" fill="#333">derives from</text>
  <line x1="800" y1="703" x2="840" y2="703" stroke="#A6699C" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrd)"/>
  <text x="848" y="707" font-size="10.5" fill="#333">weakens</text>
</svg>
